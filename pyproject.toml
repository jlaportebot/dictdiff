[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dictdiff"
version = "0.1.0"
description = "Semantic dict/JSON diff tool with rich terminal output"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "jlaportebot"}]
keywords = ["dict", "diff", "json", "compare", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
dictdiff = "dictdiff.cli:main"

[project.urls]
Repository = "https://github.com/jlaportebot/dictdiff"

[tool.setuptools.packages.find]
include = ["dictdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"
