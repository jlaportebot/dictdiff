[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dictdiff"
version = "0.1.0"
description = "Smart structural diff for JSON, YAML, and TOML files — see exactly what changed, key by key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Jonathan LaPorte" }]
keywords = ["diff", "json", "yaml", "toml", "compare", "structural", "dictionary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
dictdiff = "dictdiff.cli:main"

[project.urls]
Homepage = "https://github.com/jlaportebot/dictdiff"
Repository = "https://github.com/jlaportebot/dictdiff"
Issues = "https://github.com/jlaportebot/dictdiff/issues"
